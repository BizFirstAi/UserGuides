<svg width="1000" height="420" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark blue background -->
  <rect width="1000" height="420" fill="#0f172a"/>

  <!-- Top accent bar (blue) -->
  <rect width="1000" height="8" fill="#3b82f6"/>

  <!-- Left accent stripe (green) -->
  <rect width="8" height="420" fill="#10b981"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="0" r="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <circle cx="100" cy="400" r="60" fill="#1e293b" stroke="#10b981" stroke-width="2" opacity="0.8"/>

  <!-- Main title -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#f1f5f9">
    Building Enterprise
  </text>
  <text x="50" y="145" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#f1f5f9">
    Forms in Minutes
  </text>

  <!-- Subtitle with accent color -->
  <text x="60" y="205" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#fbbf24">
    Atlas Forms Deep Dive
  </text>

  <!-- Form field icons (rectangles representing form controls) -->
  <g id="form-icons">
    <!-- Icon 1 -->
    <rect x="100" y="280" width="80" height="50" fill="none" stroke="#10b981" stroke-width="3" rx="4"/>

    <!-- Icon 2 -->
    <rect x="250" y="280" width="80" height="50" fill="none" stroke="#3b82f6" stroke-width="3" rx="4"/>

    <!-- Icon 3 -->
    <rect x="400" y="280" width="80" height="50" fill="none" stroke="#fbbf24" stroke-width="3" rx="4"/>

    <!-- Icon 4 -->
    <rect x="550" y="280" width="80" height="50" fill="none" stroke="#10b981" stroke-width="3" rx="4"/>

    <!-- Icon 5 -->
    <rect x="700" y="280" width="80" height="50" fill="none" stroke="#3b82f6" stroke-width="3" rx="4"/>

    <!-- Icon 6 -->
    <rect x="850" y="280" width="80" height="50" fill="none" stroke="#fbbf24" stroke-width="3" rx="4"/>
  </g>

  <!-- Footer tagline -->
  <text x="50" y="375" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">
    Developer-focused • No-code studio • Enterprise scale
  </text>

  <!-- Accent gradient line -->
  <line x1="100" y1="265" x2="900" y2="265" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
</svg>
