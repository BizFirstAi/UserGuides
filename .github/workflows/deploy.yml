# DISABLED: GitHub Pages now serves docs/ directly from the main branch
# (legacy branch-deploy), built locally via `node scripts/build-docs.mjs`
# before each push. This workflow is kept for manual/reference use only —
# it no longer auto-runs on push, since Actions billing failures had been
# blocking deploys silently while this workflow was still the Pages source.
name: Build and Deploy to GitHub Pages (manual/legacy)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ── Feature 2: What's New page ─────────────────────────────────────
      # Reads git log for all HTML files added to docs/WebSites/ and builds
      # docs/whats-new/index.html grouped by month. Reruns every deploy so
      # the page always reflects the live repo state.
      - name: Generate What's New page
        run: |
          python3 - <<'PYEOF'
          import subprocess, re, os, html
          from pathlib import Path
          from collections import defaultdict

          BASE_URL = "https://docs.bizfirstai.com"
          DOCS     = Path("docs")
          OUT_DIR  = DOCS / "whats-new"
          OUT_DIR.mkdir(exist_ok=True)

          result = subprocess.run(
              ['git', 'log', '--diff-filter=A', '--name-only',
               '--pretty=format:COMMIT|%ad|%s', '--date=format:%Y-%m-%d',
               '--', 'docs/WebSites'],
              capture_output=True, text=True
          )

          entries = []
          current = None
          SKIP = {'shared.css', 'shared.js', 'blog-search.json'}

          for raw in result.stdout.splitlines():
              line = raw.strip()
              if not line:
                  continue
              if line.startswith('COMMIT|'):
                  parts = line.split('|', 2)
                  current = {'date': parts[1], 'msg': parts[2] if len(parts) > 2 else ''}
              elif line.endswith('.html') and current:
                  p = Path(line)
                  if p.name in SKIP or not p.exists():
                      continue
                  try:
                      content = p.read_text(encoding='utf-8', errors='ignore')
                      m = re.search(r'<title>([^<]+)</title>', content)
                      title = m.group(1).strip() if m else p.stem.replace('-', ' ').title()
                      # Remove " | BizFirstAI" suffix if present
                      title = re.sub(r'\s*[\|—–-]\s*BizFirstAI.*$', '', title).strip()
                  except Exception:
                      title = p.stem.replace('-', ' ').title()

                  rel = p.relative_to(DOCS).as_posix()
                  if p.name == 'index.html':
                      url = BASE_URL + '/' + p.parent.relative_to(DOCS).as_posix() + '/'
                  else:
                      url = BASE_URL + '/' + rel

                  # Derive section label from path
                  parts_path = p.relative_to(DOCS / 'WebSites').parts
                  section = parts_path[0] if parts_path else ''

                  entries.append({
                      'date': current['date'],
                      'title': title,
                      'url': url,
                      'section': section,
                      'msg': current['msg'],
                  })

          # Group by YYYY-MM
          by_month = defaultdict(list)
          for e in entries:
              by_month[e['date'][:7]].append(e)
          sorted_months = sorted(by_month.keys(), reverse=True)

          MONTH_NAMES = {
              '01':'January','02':'February','03':'March','04':'April',
              '05':'May','06':'June','07':'July','08':'August',
              '09':'September','10':'October','11':'November','12':'December'
          }

          def month_label(ym):
              y, m = ym.split('-')
              return MONTH_NAMES.get(m, m) + ' ' + y

          rows = []
          for ym in sorted_months:
              rows.append(f'<div class="month-group"><h2>{html.escape(month_label(ym))}</h2><ul class="entry-list">')
              for e in by_month[ym]:
                  sec_badge = f'<span class="section-badge">{html.escape(e["section"])}</span>' if e["section"] else ''
                  rows.append(
                      f'<li><span class="entry-date">{html.escape(e["date"])}</span>'
                      f'{sec_badge}'
                      f'<a href="{html.escape(e["url"])}" target="_top">{html.escape(e["title"])}</a></li>'
                  )
              rows.append('</ul></div>')

          total = len(entries)
          content_html = '\n'.join(rows) if rows else '<p style="color:var(--text-muted)">No new guides found in git history.</p>'

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>What's New — BizFirstAI Docs</title>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <style>
          :root{{--bg:#0f1117;--surface:#1e2736;--border:#3d4a5a;--accent:#6c8cff;--text:#e2e8f0;--text-muted:#8892b0;--text-dim:#4a5568;}}
          *{{box-sizing:border-box;margin:0;padding:0;}}
          body{{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;padding-top:40px;}}
          .topbar{{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e2736;border-bottom:1px solid #2d3a4a;height:40px;display:flex;align-items:center;padding:0 20px;}}
          .topbar img{{height:26px;}}
          .topbar-right{{margin-left:auto;display:flex;gap:6px;}}
          .topbar-right a{{font-size:12px;color:#b0c4d8;text-decoration:none;padding:4px 12px;border-radius:5px;display:flex;align-items:center;gap:6px;}}
          .topbar-right a:hover{{background:rgba(255,255,255,0.08);color:#fff;}}
          .page{{max-width:860px;margin:0 auto;padding:52px 40px;}}
          .page-header{{margin-bottom:40px;}}
          .tag{{display:inline-block;font-size:0.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:rgba(108,140,255,.15);color:var(--accent);margin-bottom:12px;}}
          h1{{font-size:2rem;font-weight:700;margin-bottom:12px;}}
          .lead{{font-size:1.05rem;color:var(--text-muted);}}
          h2{{font-size:1.1rem;font-weight:700;color:var(--text);margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}}
          .month-group{{margin-bottom:8px;}}
          .entry-list{{list-style:none;padding:0;}}
          .entry-list li{{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(61,74,90,0.4);font-size:0.9rem;flex-wrap:wrap;}}
          .entry-list li:last-child{{border-bottom:none;}}
          .entry-date{{font-size:0.72rem;color:var(--text-dim);min-width:88px;font-family:monospace;}}
          .entry-list a{{color:var(--text);text-decoration:none;flex:1;}}
          .entry-list a:hover{{color:var(--accent);}}
          .section-badge{{font-size:0.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:rgba(108,140,255,.12);color:var(--accent);white-space:nowrap;}}
          .summary{{display:inline-flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--text-muted);margin-top:10px;}}
          </style>
          </head>
          <body>
          <div class="topbar">
            <a href="https://bizfirstai.com" target="_blank"><img src="../images/icons/BizFirstAiFull.png" alt="BizFirstAI"></a>
            <div class="topbar-right">
              <a href="https://docs.bizfirstai.com/" target="_top"><i class="fa-solid fa-house"></i> Portal</a>
              <a href="https://community.bizfirstai.com" target="_blank"><i class="fa-solid fa-people-group"></i> Community</a>
            </div>
          </div>
          <div class="page">
            <div class="page-header">
              <span class="tag">Documentation</span>
              <h1>What's New</h1>
              <p class="lead">Every guide added to the portal — automatically tracked from git history.</p>
              <div class="summary"><i class="fa-solid fa-file-lines"></i> {total} guides total</div>
            </div>
            {content_html}
          </div>
          </body></html>"""

          # Dedent the page template
          import textwrap
          page = textwrap.dedent(page)

          (OUT_DIR / 'index.html').write_text(page, encoding='utf-8')
          print(f"What's New page generated: {total} entries across {len(sorted_months)} months")
          PYEOF

      # ── Feature 7: Coverage dashboard ─────────────────────────────────
      # Scans docs/WebSites/ to show which product areas are documented and
      # how many guide pages each has. Generated fresh every deploy.
      - name: Generate coverage dashboard
        run: |
          python3 - <<'PYEOF'
          import os, html
          from pathlib import Path

          BASE_URL = "https://docs.bizfirstai.com"
          DOCS     = Path("docs")
          WEB      = DOCS / "WebSites"
          OUT_DIR  = DOCS / "coverage"
          OUT_DIR.mkdir(exist_ok=True)

          SKIP = {'pagefind', 'AtlasForms', '.git', 'whats-new', 'coverage'}

          ICONS = {
              'FlowStudio':    'fa-diagram-project',
              'EdgeStream':    'fa-wave-square',
              'EdgeInteract':  'fa-comments',
              'DataOcean':     'fa-database',
              'AppStudio':     'fa-laptop-code',
              'InstallHub':    'fa-box',
              'MarketHub':     'fa-store',
              'Octopus':       'fa-spider',
              'GuardRails':    'fa-shield-halved',
              'WorkDesk':      'fa-briefcase',
              'InfraHub':      'fa-server',
              'Passport':      'fa-id-card',
              'AtlasForms':    'fa-wpforms',
              'ANCP':          'fa-network-wired',
              'BizFirstObserve':'fa-eye',
              'MultiQuery':    'fa-magnifying-glass',
              'ErrorManagement':'fa-triangle-exclamation',
              'NodeLifeCycle': 'fa-rotate',
              'NodePolicies':  'fa-shield',
              'NodeExpressionEngine': 'fa-code',
              'BizExpressions':'fa-brackets-curly',
          }

          products = []
          for d in sorted(WEB.iterdir()):
              if not d.is_dir() or d.name in SKIP:
                  continue
              pages = [f for f in d.rglob('*.html') if f.name not in ('shared.css', 'shared.js')]
              guide_dirs = [sub for sub in d.iterdir() if sub.is_dir()]
              icon = ICONS.get(d.name, 'fa-book')
              url  = f"{BASE_URL}/WebSites/{d.name}/"
              color = '#34d399' if len(pages) >= 10 else '#fbbf24' if len(pages) >= 3 else '#f87171'
              products.append({
                  'name': d.name,
                  'pages': len(pages),
                  'guides': len(guide_dirs),
                  'icon': icon,
                  'url': url,
                  'color': color,
              })

          total_pages  = sum(p['pages'] for p in products)
          total_prods  = len(products)
          well_covered = sum(1 for p in products if p['pages'] >= 10)

          cards = []
          for p in products:
              cards.append(f"""
          <a href="{html.escape(p['url'])}" class="cov-card" target="_top">
            <div class="cov-icon" style="background:rgba(108,140,255,0.1)">
              <i class="fa-solid {p['icon']}" style="font-size:22px;color:var(--accent)"></i>
            </div>
            <div class="cov-name">{html.escape(p['name'])}</div>
            <div class="cov-count" style="color:{p['color']}">{p['pages']} pages</div>
            <div class="cov-bar-bg"><div class="cov-bar" style="width:{min(100,p['pages']*3)}%;background:{p['color']}"></div></div>
          </a>""")

          cards_html = '\n'.join(cards)

          legend = """
          <div class="legend">
            <span><span class="dot" style="background:#34d399"></span> Well documented (10+)</span>
            <span><span class="dot" style="background:#fbbf24"></span> Sparse (3–9)</span>
            <span><span class="dot" style="background:#f87171"></span> Needs work (&lt;3)</span>
          </div>"""

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Docs Coverage — BizFirstAI</title>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <style>
          :root{{--bg:#0f1117;--surface:#1e2736;--border:#3d4a5a;--accent:#6c8cff;--text:#e2e8f0;--text-muted:#8892b0;--text-dim:#4a5568;--radius:10px;}}
          *{{box-sizing:border-box;margin:0;padding:0;}}
          body{{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding-top:40px;}}
          .topbar{{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e2736;border-bottom:1px solid #2d3a4a;height:40px;display:flex;align-items:center;padding:0 20px;}}
          .topbar img{{height:26px;}}
          .topbar-right{{margin-left:auto;display:flex;gap:6px;}}
          .topbar-right a{{font-size:12px;color:#b0c4d8;text-decoration:none;padding:4px 12px;border-radius:5px;display:flex;align-items:center;gap:6px;}}
          .topbar-right a:hover{{background:rgba(255,255,255,0.08);color:#fff;}}
          .page{{max-width:960px;margin:0 auto;padding:52px 40px;}}
          .page-header{{margin-bottom:40px;}}
          .tag{{display:inline-block;font-size:0.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:rgba(108,140,255,.15);color:var(--accent);margin-bottom:12px;}}
          h1{{font-size:2rem;font-weight:700;margin-bottom:12px;}}
          .lead{{font-size:1.05rem;color:var(--text-muted);}}
          .stats{{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap;}}
          .stat{{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;min-width:120px;}}
          .stat-value{{font-size:1.8rem;font-weight:700;color:var(--accent);}}
          .stat-label{{font-size:0.75rem;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.07em;}}
          .cov-grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:32px;}}
          .cov-card{{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-decoration:none;display:block;transition:all 0.18s;}}
          .cov-card:hover{{border-color:rgba(108,140,255,0.4);transform:translateY(-2px);}}
          .cov-icon{{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}}
          .cov-name{{font-size:0.9rem;font-weight:600;color:var(--text);margin-bottom:4px;}}
          .cov-count{{font-size:0.8rem;font-weight:600;margin-bottom:8px;}}
          .cov-bar-bg{{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}}
          .cov-bar{{height:100%;border-radius:2px;transition:width 0.3s;}}
          .legend{{display:flex;gap:20px;margin-top:28px;flex-wrap:wrap;font-size:0.8rem;color:var(--text-muted);align-items:center;}}
          .dot{{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;}}
          </style>
          </head>
          <body>
          <div class="topbar">
            <a href="https://bizfirstai.com" target="_blank"><img src="../images/icons/BizFirstAiFull.png" alt="BizFirstAI"></a>
            <div class="topbar-right">
              <a href="https://docs.bizfirstai.com/" target="_top"><i class="fa-solid fa-house"></i> Portal</a>
              <a href="https://docs.bizfirstai.com/whats-new/" target="_top"><i class="fa-solid fa-sparkles"></i> What's New</a>
            </div>
          </div>
          <div class="page">
            <div class="page-header">
              <span class="tag">Documentation</span>
              <h1>Coverage Dashboard</h1>
              <p class="lead">Documentation health across all BizFirstAI product areas.</p>
              <div class="stats">
                <div class="stat"><div class="stat-value">{total_prods}</div><div class="stat-label">Products</div></div>
                <div class="stat"><div class="stat-value">{total_pages}</div><div class="stat-label">Total pages</div></div>
                <div class="stat"><div class="stat-value">{well_covered}</div><div class="stat-label">Well covered</div></div>
              </div>
              {legend}
            </div>
            <div class="cov-grid">
              {cards_html}
            </div>
          </div>
          </body></html>"""

          import textwrap
          page = textwrap.dedent(page)
          (OUT_DIR / 'index.html').write_text(page, encoding='utf-8')
          print(f"Coverage dashboard: {total_prods} products, {total_pages} pages")
          PYEOF

      # ── Feature 4a: Inject docs-repo meta tag ─────────────────────────
      # Adds <meta name="docs-repo" content="OWNER/REPO"> to every HTML page.
      # shared.js reads this to build GitHub Issue URLs for the feedback widget.
      - name: Inject docs-repo meta tag
        env:
          REPO: ${{ github.repository }}
        run: |
          find docs -name "*.html" | xargs grep -rL 'name="docs-repo"' | while IFS= read -r f; do
            sed -i "s|<meta charset=\"UTF-8\">|<meta charset=\"UTF-8\"><meta name=\"docs-repo\" content=\"${REPO}\">|" "$f"
          done
          echo "docs-repo meta injected (repo: ${REPO})"

      # ── Feature 4b: Inject OpenGraph meta tags ─────────────────────────
      # Adds og:title, og:description, og:url, og:image so shared URLs on
      # LinkedIn / Slack show a proper preview card instead of blank.
      - name: Inject OpenGraph tags
        run: |
          python3 - <<'PYEOF'
          import re, html
          from pathlib import Path

          BASE_URL      = "https://docs.bizfirstai.com"
          DEFAULT_IMAGE = f"{BASE_URL}/images/icons/BizFirstAiFull.png"
          DOCS          = Path("docs")
          count         = 0

          for html_file in sorted(DOCS.rglob("*.html")):
              content = html_file.read_text(encoding="utf-8", errors="ignore")
              if 'og:title' in content:
                  continue

              # Title
              m = re.search(r'<title>([^<]+)</title>', content)
              title = m.group(1).strip() if m else "BizFirstAI Documentation"

              # Description: prefer .lead, fall back to first substantial <p>
              m = re.search(r'class=["\']lead["\'][^>]*>([^<]{10,})', content)
              if not m:
                  m = re.search(r'<p[^>]*>([^<]{30,})', content)
              desc = m.group(1).strip()[:200] if m else "BizFirstAI Developer Documentation"
              desc = re.sub(r'\s+', ' ', desc)

              # Canonical URL
              rel = html_file.relative_to(DOCS).as_posix()
              if rel == "index.html":
                  canon = BASE_URL + "/"
              elif html_file.name == "index.html":
                  canon = BASE_URL + "/" + html_file.parent.relative_to(DOCS).as_posix() + "/"
              else:
                  canon = BASE_URL + "/" + rel

              og = (
                  f'\n<meta property="og:type" content="website">'
                  f'\n<meta property="og:site_name" content="BizFirstAI Docs">'
                  f'\n<meta property="og:title" content="{html.escape(title)}">'
                  f'\n<meta property="og:description" content="{html.escape(desc)}">'
                  f'\n<meta property="og:url" content="{html.escape(canon)}">'
                  f'\n<meta property="og:image" content="{DEFAULT_IMAGE}">'
                  f'\n<meta name="twitter:card" content="summary_large_image">'
                  f'\n<meta name="twitter:title" content="{html.escape(title)}">'
                  f'\n<meta name="twitter:description" content="{html.escape(desc)}">'
              )

              # Insert immediately after the viewport meta tag
              new_content = re.sub(
                  r'(<meta[^>]+viewport[^>]+>)',
                  r'\1' + og,
                  content, count=1
              )
              if new_content != content:
                  html_file.write_text(new_content, encoding="utf-8")
                  count += 1

          print(f"OpenGraph tags injected into {count} pages")
          PYEOF

      # ── Features 5, 6, 8: Distribute shared.js + inject script tag ────
      # Copies docs/WebSites/shared.js to every product-level directory that
      # has a shared.css (reading time, copy buttons, feedback, embed mode).
      # Then injects <script src="../shared.js"> into all guide pages that
      # reference ../shared.css, using the same relative prefix.
      - name: Distribute shared.js to guide sections
        run: |
          python3 - <<'PYEOF'
          import shutil, re
          from pathlib import Path

          MASTER = Path("docs/WebSites/shared.js")
          WEB    = Path("docs/WebSites")

          # Copy master to every dir containing shared.css
          for css in WEB.rglob("shared.css"):
              target = css.parent / "shared.js"
              shutil.copy(MASTER, target)

          # Inject <script> tag into every guide HTML page that links shared.css
          injected = 0
          for html_file in WEB.rglob("*.html"):
              content = html_file.read_text(encoding="utf-8", errors="ignore")
              if 'shared.js' in content:
                  continue
              # Derive the JS path from the CSS path already in the file
              m = re.search(r'href=["\']([^"\']*shared\.css)["\']', content)
              if not m:
                  continue
              js_src = m.group(1).replace('shared.css', 'shared.js')
              content = content.replace('</body>', f'<script src="{js_src}"></script>\n</body>', 1)
              html_file.write_text(content, encoding="utf-8")
              injected += 1

          print(f"shared.js distributed and injected into {injected} pages")
          PYEOF

      # ── Existing: Mark sidebar nav elements ───────────────────────────
      - name: Mark sidebar nav elements to exclude from search index
        run: |
          find docs -name "*.html" -exec sed -i 's|<nav |<nav data-pagefind-ignore |g' {} \;

      # ── Existing: Fetch and index blog posts ──────────────────────────
      - name: Fetch and index blog posts
        run: |
          python3 - <<'PYEOF'
          import urllib.request, xml.etree.ElementTree as ET, json, re
          try:
              req = urllib.request.Request(
                  'https://blog.bizfirstai.com/feed',
                  headers={'User-Agent': 'Mozilla/5.0 (BizFirstAI docs build)'}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  xml_data = r.read()
              root = ET.fromstring(xml_data)
              items = []
              for item in root.findall('.//item'):
                  link = (item.findtext('link') or '').strip()
                  guid = (item.findtext('guid') or '').strip()
                  url  = link or guid
                  url  = re.sub(r'https?://localhost:\d+', 'https://blog.bizfirstai.com', url)
                  desc = (item.findtext('description') or '')
                  desc = re.sub(r'<[^>]+>', '', desc).strip()[:300]
                  pub  = (item.findtext('pubDate') or '').strip()
                  items.append({
                      'title': (item.findtext('title') or '').strip(),
                      'url':   url,
                      'description': desc,
                      'date': pub
                  })
              with open('docs/blog-search.json', 'w') as f:
                  json.dump(items, f)
              print(f'Indexed {len(items)} blog posts')
          except Exception as e:
              print(f'Blog fetch skipped: {e}')
              with open('docs/blog-search.json', 'w') as f:
                  json.dump([], f)
          PYEOF

      # ── Existing: Generate sitemap ────────────────────────────────────
      - name: Generate RSS feed
        run: |
          python3 - <<'PYEOF'
          import os, re, datetime
          from pathlib import Path

          BASE_URL  = "https://docs.bizfirstai.com"
          DOCS      = Path("docs")
          WEBSITES  = DOCS / "WebSites"
          MAX_ITEMS = 50
          NOW_RFC   = datetime.datetime.utcnow().strftime("%a, %d %b %Y %H:%M:%S +0000")

          import xml.sax.saxutils as saxutils

          def esc(s): return saxutils.escape(str(s))

          # Collect HTML files sorted by mtime descending
          files = sorted(
              [f for f in WEBSITES.rglob("*.html") if f.name not in ("shared.css","shared.js")],
              key=lambda f: f.stat().st_mtime, reverse=True
          )[:MAX_ITEMS]

          items = []
          for f in files:
              try:
                  content = f.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              m = re.search(r"<title>([^<]+)</title>", content)
              title = re.sub(r"\s*[\|—–\-]\s*BizFirstAI.*$", "", m.group(1).strip()) if m else f.stem.replace("-", " ").title()
              d = re.search(r'<meta\s+name="description"\s+content="([^"]+)"', content)
              desc = d.group(1).strip()[:300] if d else "BizFirstAI documentation guide."
              rel = f.relative_to(DOCS).as_posix()
              if f.name == "index.html":
                  url = BASE_URL + "/" + f.parent.relative_to(DOCS).as_posix() + "/"
              else:
                  url = BASE_URL + "/" + rel
              mtime = datetime.datetime.utcfromtimestamp(f.stat().st_mtime)
              pub = mtime.strftime("%a, %d %b %Y %H:%M:%S +0000")
              items.append(
                  "  <item>\n"
                  f"    <title>{esc(title)}</title>\n"
                  f"    <link>{esc(url)}</link>\n"
                  f"    <description>{esc(desc)}</description>\n"
                  f"    <pubDate>{pub}</pubDate>\n"
                  f'    <guid isPermaLink="true">{esc(url)}</guid>\n'
                  "  </item>"
              )

          feed = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
            <channel>
              <title>BizFirstAI Documentation</title>
              <link>{BASE_URL}/</link>
              <description>Guides, references, and deep-dives for BizFirstAI — AI-powered workflow automation for finance and operations teams.</description>
              <language>en-us</language>
              <lastBuildDate>{NOW_RFC}</lastBuildDate>
              <atom:link href="{BASE_URL}/feed.xml" rel="self" type="application/rss+xml"/>
          {"".join(chr(10) + i for i in items)}
            </channel>
          </rss>"""

          (DOCS / "feed.xml").write_text(feed, encoding="utf-8")
          print(f"feed.xml — {len(items)} items written")
          PYEOF

      - name: Generate sitemap
        run: |
          python3 - <<'PYEOF'
          import os, datetime

          BASE_URL = "https://docs.bizfirstai.com"
          DOCS_DIR = "docs"
          TODAY     = datetime.date.today().isoformat()

          SKIP_DIRS = {"pagefind", "AtlasForms", "_next", ".git"}

          def priority(parts, is_index):
              depth = len(parts)
              if depth == 1 and is_index: return "1.0"
              if depth == 2 and is_index: return "0.9"
              if depth == 3 and is_index: return "0.8"
              if depth == 4 and is_index: return "0.7"
              if depth <= 3: return "0.6"
              return "0.5"

          entries = []
          for root, dirs, files in os.walk(DOCS_DIR):
              dirs[:] = sorted(d for d in dirs if d not in SKIP_DIRS)
              for fname in sorted(files):
                  if not fname.endswith(".html"):
                      continue
                  rel = os.path.relpath(os.path.join(root, fname), DOCS_DIR).replace("\\", "/")
                  parts = rel.split("/")
                  is_index = fname == "index.html"
                  if is_index:
                      parent = parts[:-1]
                      url = BASE_URL + ("/" if not parent else "/" + "/".join(parent) + "/")
                  else:
                      url = BASE_URL + "/" + rel
                  entries.append((url, priority(parts, is_index)))

          entries.sort(key=lambda x: x[0])

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for url, pri in entries:
              lines += [
                  "  <url>",
                  f"    <loc>{url}</loc>",
                  f"    <lastmod>{TODAY}</lastmod>",
                  f"    <priority>{pri}</priority>",
                  "  </url>"
              ]
          lines.append("</urlset>")

          out = os.path.join(DOCS_DIR, "sitemap.xml")
          with open(out, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"sitemap.xml — {len(entries)} URLs written to {out}")
          PYEOF

      # ── Feature 3: Broken link checker ────────────────────────────────
      # Scans every HTML page for internal <a href> links and verifies each
      # referenced file exists on disk. Fails the build if any are broken,
      # preventing a broken deploy from going live.
      - name: Check broken internal links
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          from urllib.parse import unquote

          DOCS = Path("docs")

          # External / special prefixes to skip
          SKIP_PREFIXES = ('http://', 'https://', '//', 'mailto:', 'tel:', '#', 'javascript:', 'data:', '/')

          errors = []

          for html_file in sorted(DOCS.rglob("*.html")):
              content = html_file.read_text(encoding="utf-8", errors="ignore")
              # Strip HTML entity-encoded tags (code examples) to avoid false positives
              scan = re.sub(r'&lt;[^&>]*href=["\'][^"\']*["\'][^&>]*&gt;', '', content)
              hrefs   = re.findall(r'href=["\']([^"\']+)["\']', scan)

              for raw_href in hrefs:
                  href = unquote(raw_href.split('#')[0].split('?')[0])
                  if not href or any(href.startswith(p) for p in SKIP_PREFIXES):
                      continue
                  # Skip template/expression variable placeholders
                  if '{' in href:
                      continue

                  # Resolve relative to the current file
                  target = (html_file.parent / href).resolve()
                  docs_root = DOCS.resolve()

                  # Must stay within docs/
                  try:
                      target.relative_to(docs_root)
                  except ValueError:
                      continue

                  if not target.exists():
                      rel_page = html_file.relative_to(DOCS)
                      errors.append(f"  {rel_page}  →  {href}")

          if errors:
              print(f"\n❌ BROKEN INTERNAL LINKS ({len(errors)} found):\n")
              for e in errors:
                  print(e)
              print("\nFix the links above, then push again.\n")
              raise SystemExit(1)
          else:
              print(f"✅ All internal links valid")
          PYEOF

      - name: Build Pagefind search index
        run: npx pagefind@latest --site docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping blog directories and WebSub
        run: |
          # Ping-O-Matic — notifies ~20 blog/content directories
          curl -s -X POST "http://rpc.pingomatic.com/" \
            -H "Content-Type: text/xml" \
            -d '<?xml version="1.0"?><methodCall><methodName>weblogUpdates.extendedPing</methodName><params><param><value><string>BizFirstAI Documentation</string></value></param><param><value><string>https://docs.bizfirstai.com/</string></value></param><param><value><string>https://docs.bizfirstai.com/</string></value></param><param><value><string>https://docs.bizfirstai.com/feed.xml</string></value></param></params></methodCall>' \
            | grep -o '<string>[^<]*</string>' | head -2 || true
          # WebSub — notifies Google content hub + Superfeedr
          for HUB in "https://pubsubhubbub.appspot.com/" "https://pubsubhubbub.superfeedr.com/"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HUB" \
              --data-urlencode "hub.mode=publish" \
              --data-urlencode "hub.url=https://docs.bizfirstai.com/feed.xml")
            echo "WebSub $HUB → HTTP $STATUS"
          done

      - name: Ping IndexNow
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "docs.bizfirstai.com",
              "key": "6517b39d-a8a1-4be8-8aa3-dcba6632387a",
              "keyLocation": "https://docs.bizfirstai.com/6517b39d-a8a1-4be8-8aa3-dcba6632387a.txt",
              "urlList": ["https://docs.bizfirstai.com/sitemap.xml"]
            }' | grep -q "200\|202" && echo "IndexNow ping accepted" || echo "IndexNow ping failed (non-critical)"
